name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at the same time; a newer push waits for the current one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bms
          POSTGRES_USER: bms
          POSTGRES_PASSWORD: bms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_ENGINE: postgres
      DB_NAME: bms
      DB_USER: bms
      DB_PASSWORD: bms
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend tests (PostgreSQL, incl. concurrency tests)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py test --noinput

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ~/bms_system
            git fetch --quiet origin main
            git reset --hard origin/main   # deploy/.env is untracked, so it is kept
            cd deploy
            sudo docker compose up -d --build
            sudo docker image prune -f
            sudo docker compose ps
